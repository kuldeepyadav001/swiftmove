# Rename/copy this to netlify.toml before deploying to Netlify.
# Replace YOUR-RAILWAY-BACKEND.up.railway.app with your real Railway backend domain.

[build]
base=frontend
  command = "npm install && npm run build"
  publish = "dist"

# API proxy: keeps frontend code using /api/... unchanged.
[[redirects]]
  from = "/api/*"
  to = "https://swiftmove-production-5a95.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback for React routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
